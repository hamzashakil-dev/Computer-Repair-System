@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,1fr)}.lower-grid{grid-template-columns:1fr}.layout{grid-template-columns:205px 1fr}.main{padding:27px 24px}}@media(max-width:720px){.topbar{padding:0 16px;height:58px}.layout{display:block;min-height:calc(100vh - 58px)}.sidebar{position:fixed;z-index:15;left:0;top:58px;bottom:0;width:245px;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.drawer-overlay.show{display:block;position:fixed;inset:58px 0 0;background:#0009;z-index:14}.mobile-menu{display:inline-flex}.main{padding:23px 15px 45px}.pagehead{align-items:flex-start;flex-direction:column}.pagehead h1{font-size:25px}.stats-grid{grid-template-columns:repeat(2,1fr);gap:9px}.stat-card{padding:13px;min-height:96px}.stat-number{font-size:23px}.portal-grid{grid-template-columns:1fr}.access-card{padding:27px 22px}.access-card h1{font-size:29px}.top-actions{gap:8px}.pill{display:none}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.chart{gap:5px}.bar-label{font-size:8px}.toolbar .field{min-width:145px}.toolbar{align-items:stretch}.modal{padding:18px}.actions{flex-wrap:wrap}}

<body>
<div class="intro" id="intro"><div class="intro-inner"><div class="intro-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="m8 10 4-2.3 4 2.3v4l-4 2.3L8 14z"/><path d="M12 7.7v4.6m4-2.3-4 2.3-4-2.3"/></svg></div><div class="intro-name">Northstar · Repair Operations</div><div class="loading-line"></div></div></div>
<div id="root"></div><div class="toast-zone" id="toasts"></div>
<script>
(()=>{'use strict';
const API=location.protocol==='file:'?'http://127.0.0.1:8765':'';const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const STATUS=['Received','Repairing','Ready','Collected'];let state={online:false,health:null,dash:null,tickets:[],parts:[],portal:null,view:'overview',adminToken:'',adminStats:null,monthly:null,inventory:null,filter:'all',query:'',searchResult:null,sortedTickets:null,sort:'recent',timer:null,loading:false};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>new Intl.NumberFormat(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0), svg=(name)=>({menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',ticket:'<path d="M4 5h16v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6z"/><path d="M12 8v2m0 3v3"/>',parts:'<path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',chart:'<path d="M4 19V5m0 14h17"/><path d="m7 15 4-4 3 2 6-7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',logout:'<path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>',eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 12-2L20 12M4 12l2.4 5a7 7 0 0 0 12-2"/>'})[name]||'<circle cx="12" cy="12" r="8"/>', icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${svg(n)}</svg>`;
async function api(path,{method='GET',data,admin=false,timeout=7000}={}){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{const headers={};if(data!==undefined)headers['Content-Type']='application/json';if(admin&&state.adminToken)headers['X-Admin-Token']=state.adminToken;const r=await fetch(API+path,{method,headers,body:data===undefined?undefined:JSON.stringify(data),signal:ctrl.signal,cache:'no-store'});let j={};try{j=await r.json()}catch{}if(!r.ok){let e=new Error(j.error||`Request failed (${r.status})`);e.status=r.status;throw e}return j}catch(e){if(e.name==='AbortError')throw new Error('The C backend did not respond in time.');if(e instanceof TypeError)throw new Error('Cannot reach the C backend at 127.0.0.1:8765.');throw e}finally{clearTimeout(timer)}}
function toast(title,msg='',type='ok'){let el=document.createElement('div');el.className='toast '+type;el.innerHTML=`<strong>${esc(title)}</strong>${esc(msg)}`;$('#toasts').append(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),250)},3400)}
function setConnected(ok,health){state.online=ok;if(health)state.health=health;const dot=$('.conn .dot'),label=$('.conn .label');if(dot){dot.classList.toggle('off',!ok);label.textContent=ok?'C backend connected':'Backend offline'}}
async function checkHealth(){try{const h=await api('/api/health');setConnected(true,h);return h}catch(e){setConnected(false);throw e}}
async function refreshData(silent=true){if(state.loading||!state.portal)return;state.loading=true;try{const [d,t,p]=await Promise.all([api('/api/dashboard'),api('/api/tickets'),api('/api/parts')]);state.dash=d;state.tickets=t.tickets||[];state.parts=p.parts||[];setConnected(true);if(state.portal==='admin'&&state.adminToken){const [s,m,v]=await Promise.all([api('/api/admin/stats',{admin:true}),api('/api/admin/monthly',{admin:true}),api('/api/admin/inventory',{admin:true})]);state.adminStats=s;state.monthly=m.months;state.inventory=v}if(state.view!=='login')renderApp();}catch(e){setConnected(false);if(!silent)toast('Sync failed',e.message,'err');if($('#root').querySelector('.app-shell'))renderApp()}finally{state.loading=false}}
function intro(){setTimeout(()=>$('#intro').classList.add('done'),650)}
function access(){clearInterval(state.timer);state.portal=null;state.adminToken='';state.view='access';$('#root').innerHTML=`<div class="screen"><div class="access-card"><div class="brand"><span class="brandmark">${icon('grid')}</span><span>NORTHSTAR <span class="muted">/ SERVICE DESK</span></span></div><div class="eyebrow" style="margin-top:30px">COMPUTER REPAIR CENTER · LOCAL SYSTEM</div><h1>Repair operations,<br>with a clearer view.</h1><div class="subhead">A live interface for your service desk and repair inventory.</div><div class="portal-grid"><button class="portal" id="userPortal"><span class="symbol">${icon('ticket')}</span><strong>Service desk</strong><p>Register repairs, track tickets, and manage spare parts.</p><span class="go">Enter user workspace →</span></button><button class="portal" id="adminPortal"><span class="symbol">${icon('chart')}</span><strong>Administrator</strong><p>Review operational analytics, revenue, and inventory.</p><span class="go">Administrator sign-in →</span></button></div><div class="tagline"><span class="conn"><i class="dot off"></i><span class="label">Checking local C backend…</span></span><br><span>Data is served by the C application · 127.0.0.1:8765</span></div></div></div>`;$('#userPortal').onclick=()=>enterUser();$('#adminPortal').onclick=()=>loginScreen();checkHealth().then(()=>{}).catch(()=>{});}
async function enterUser(){state.portal='user';state.view='overview';try{await checkHealth();await refreshData(false);state.timer=setInterval(()=>refreshData(true),5000);renderApp()}catch(e){connectionScreen(e.message)}}
function connectionScreen(msg){$('#root').innerHTML=`<div class="screen"><div class="error-screen"><div class="error-symbol">${icon('refresh')}</div><div class="eyebrow">LOCAL C BACKEND UNAVAILABLE</div><h1>The service desk is offline.</h1><p>The HTML interface is ready, but the actual C backend is not responding. Start <strong>repair_center_backend.exe</strong> and retry. No demo figures or simulated records are shown.</p><p>Expected endpoint<br><code>http://127.0.0.1:8765</code></p><p class="muted">${esc(msg||'Connection refused')}</p><button class="btn primary" id="retry">${icon('refresh')} Retry connection</button> <button class="btn quiet" id="back">Back to access</button></div></div>`;$('#retry').onclick=()=>enterUser();$('#back').onclick=access}
function loginScreen(){clearInterval(state.timer);state.portal='admin';state.view='login';state.adminToken='';$('#root').innerHTML=`<div class="screen"><div class="access-card" style="max-width:450px"><button class="btn quiet small" id="goBack" style="margin-bottom:22px">← Back to portals</button><div class="brand"><span class="brandmark">${icon('chart')}</span><span>NORTHSTAR <span class="muted">/ ADMIN</span></span></div><div class="eyebrow" style="margin-top:30px">ADMINISTRATOR ACCESS</div><h1 style="font-size:28px">Sign in to command view.</h1><p class="subhead">Credentials are checked by the local C backend.</p><form id="loginForm" style="margin-top:22px"><div class="form-group"><label>Username</label><input class="field" name="username" autocomplete="username" required maxlength="29" placeholder="Administrator username"></div><div class="form-group" style="margin-top:13px"><label>Password</label><div style="display:flex;gap:7px"><input class="field" id="pw" type="password" name="password" autocomplete="current-password" required maxlength="29" placeholder="Password"><button class="icon-btn" type="button" id="togglePw" aria-label="Show password">${icon('eye')}</button></div></div><div id="loginErr" class="muted" style="min-height:20px;margin-top:11px;font-size:11px"></div><button class="btn primary" style="width:100%;justify-content:center;margin-top:8px" type="submit">Authenticate with C backend →</button></form><div class="footnote">Demo credentials are maintained and validated only by the C source. This local demonstration is not production-grade authentication.</div></div></div>`;$('#goBack').onclick=access;$('#togglePw').onclick=()=>$('#pw').type=$('#pw').type==='password'?'text':'password';$('#loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget),b=e.currentTarget.querySelector('button[type=submit]');b.disabled=true;b.textContent='Verifying…';$('#loginErr').textContent='';try{let r=await api('/api/admin/login',{method:'POST',data:{username:f.get('username'),password:f.get('password')}});state.adminToken=r.token;state.portal='admin';state.view='overview';await checkHealth();await refreshData(false);state.timer=setInterval(()=>refreshData(true),5000);renderApp()}catch(err){$('#loginErr').textContent=err.message;if(err.status!==401)setConnected(false)}finally{b.disabled=false;b.textContent='Authenticate with C backend →'}}}
const navItems=()=>state.portal==='admin'?[['overview','grid','Overview'],['tickets','ticket','All tickets'],['analytics','chart','Analytics'],['inventory','parts','Inventory']]:[['overview','grid','Overview'],['tickets','ticket','Tickets'],['parts','parts','Spare parts']];
function renderApp(){if(!state.portal)return;const admin=state.portal==='admin';if(admin&&!state.adminToken){if(state.view!=='login')loginScreen();return}const title=({overview:'Operations overview',tickets:admin?'Ticket register':'Ticket management',parts:'Spare parts',analytics:'Performance & revenue',inventory:'Inventory summary'})[state.view]||'Operations overview';$('#root').innerHTML=`<div class="app-shell"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn small mobile-menu" id="hamb">${icon('menu')}</button><div class="brand"><span class="brandmark">${icon('grid')}</span><span>NORTHSTAR <span class="muted">/ REPAIR CENTER</span></span></div></div><div class="top-actions"><div class="conn"><i class="dot ${state.online?'':'off'}"></i><span class="label">${state.online?'C backend connected':'Backend offline'}</span></div><span class="pill">${admin?'Administrator':'Service desk'}</span><button class="btn quiet small" id="switchPortal">Exit workspace</button></div></header><div class="layout"><aside class="sidebar" id="sidebar"><div class="side-label">${admin?'Command view':'Workspace'}</div><nav class="nav">${navItems().map(([id,ic,label])=>`<button data-view="${id}" class="${state.view===id?'active':''}">${icon(ic)}${label}</button>`).join('')}</nav><div class="side-foot"><strong>Local engine · C</strong>Polling live data every 5 seconds.<br>Files remain in the backend's working folder.</div></aside><div class="drawer-overlay" id="drawer"></div><main class="main"><div class="pagehead"><div><div class="eyebrow">${admin?'ADMINISTRATOR PORTAL':'USER PORTAL'} · LIVE DATA</div><h1>${title}</h1><div class="subhead">${state.view==='overview'?'A live snapshot from the C service desk.':state.view==='analytics'?'Performance figures calculated from actual ticket records.':state.view==='inventory'?'Actual spare-part records and stock value.':state.view==='parts'?'Parts catalog stored by the C backend.':'Browse, search, and update real repair records.'}</div></div><div class="actions">${state.view==='tickets'&&!admin?`<button class="btn primary" id="newTicket">${icon('plus')} Register ticket</button>`:''}${state.view==='parts'&&!admin?`<button class="btn primary" id="newPart">${icon('plus')} Add spare part</button>`:''}${admin?`<button class="btn small" id="backup">${icon('download')} Data snapshot</button><button class="btn small danger" id="logout">${icon('logout')} Sign out</button>`:''}</div></div><div id="content">${viewContent()}</div><div class="footnote">Connected to <span class="mono">127.0.0.1:8765</span> · Last refreshed <span id="lastRefresh">${new Date().toLocaleTimeString()}</span></div></main></div></div>`;
$$('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;$('#sidebar').classList.remove('open');$('#drawer').classList.remove('show');renderApp()});$('#switchPortal').onclick=()=>state.portal==='admin'?logout():access();$('#hamb').onclick=()=>{$('#sidebar').classList.toggle('open');$('#drawer').classList.toggle('show')};$('#drawer').onclick=()=>{$('#sidebar').classList.remove('open');$('#drawer').classList.remove('show')};if($('#newTicket'))$('#newTicket').onclick=ticketModal;if($('#newPart'))$('#newPart').onclick=partModal;if($('#logout'))$('#logout').onclick=logout;if($('#backup'))$('#backup').onclick=downloadBackup;wireView();}
function $$(s){return [...document.querySelectorAll(s)]}
function statCard(label,val,note='From live records'){return `<div class="stat-card"><div class="stat-label">${esc(label)}</div><div class="stat-number mono">${esc(val)}</div><div class="stat-note">${esc(note)}</div></div>`}
function overview(){if(!state.dash)return loadingCards();const d=state.dash;let recent=[...state.tickets].sort((a,b)=>b.id-a.id).slice(0,6);return `<div class="stats-grid">${statCard('Total tickets',d.total)}${statCard('Received',d.received,'Awaiting assessment')}${statCard('Repairing',d.repairing,'Currently in service')}${statCard('Ready',d.ready,'Awaiting collection')}${statCard('Collected',d.collected,'Completed tickets')}${statCard('Part types',d.parts,'Inventory catalog')}</div><div class="grid lower-grid"><section class="card"><div class="card-head"><div><h2>Recently registered</h2><p>Latest ticket IDs from the C data store.</p></div><button class="btn small" data-goto="tickets">View all →</button></div>${recent.length?ticketTable(recent,true):empty('No tickets yet','New tickets registered by the service desk will appear here.')}</section><section class="card"><div class="card-head"><div><h2>Quick actions</h2><p>Operations sent directly to the C backend.</p></div></div><div class="quick-grid"><button class="quick" id="quickTicket"><div class="qi">${icon('plus')}</div><strong>Register repair</strong><span>Create a customer ticket</span></button><button class="quick" data-goto="tickets"><div class="qi">${icon('search')}</div><strong>Find a ticket</strong><span>Search and update status</span></button><button class="quick" id="quickPart"><div class="qi">${icon('parts')}</div><strong>Add spare part</strong><span>Record stock and unit price</span></button><button class="quick" data-goto="parts"><div class="qi">${icon('grid')}</div><strong>View inventory</strong><span>Browse current part records</span></button></div></section></div>`}
function loadingCards(){return `<div class="stats-grid">${Array.from({length:6},()=>'<div class="stat-card"><div class="skeleton" style="width:75px"></div><div class="skeleton" style="width:50px;height:25px;margin-top:14px"></div></div>').join('')}</div>`}
function empty(title,desc){return `<div class="empty"><strong>${esc(title)}</strong>${esc(desc)}</div>`}
function ticketTable(rows,compact=false){return `<div class="table-wrap"><table class="table"><thead><tr><th>Ticket</th><th>Customer</th><th>Device</th><th>Month</th><th>Status</th><th>Estimate</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td class="id mono">#${t.id}</td><td>${esc(t.name)}<div class="muted" style="font-size:10px">${esc(t.phone)}</div></td><td>${esc(t.device)}</td><td>${MONTHS[(t.month||1)-1]}</td><td><span class="status s${t.status}">${esc(t.statusName||STATUS[t.status]||'Unknown')}</span></td><td class="mono">${money(t.cost)}</td><td><button class="btn small" data-detail="${t.id}">Details</button></td></tr>`).join('')}</tbody></table></div>`}
function ticketsView(){let base=state.searchResult!==null?state.searchResult:(state.sortedTickets||state.tickets),rows=[...base];if(state.query){let q=state.query.toLowerCase();rows=rows.filter(t=>String(t.id).includes(q)||t.name.toLowerCase().includes(q)||t.phone.includes(q)||t.device.toLowerCase().includes(q))}if(state.filter!=='all')rows=rows.filter(t=>t.status===Number(state.filter));if(state.sort==='costAsc')rows.sort((a,b)=>a.cost-b.cost);else if(state.sort==='costDesc')rows.sort((a,b)=>b.cost-a.cost);else rows.sort((a,b)=>b.id-a.id);return `<section class="card"><div class="toolbar"><input class="field" id="ticketSearch" value="${esc(state.query)}" placeholder="Search ticket ID, customer, phone…"> <select class="field" id="statusFilter"><option value="all">All statuses</option>${STATUS.map((x,i)=>`<option value="${i}" ${String(i)===state.filter?'selected':''}>${x}</option>`).join('')}</select><select class="field" id="ticketSort"><option value="recent" ${state.sort==='recent'?'selected':''}>Newest first</option><option value="costAsc" ${state.sort==='costAsc'?'selected':''}>Cost · low to high</option><option value="costDesc" ${state.sort==='costDesc'?'selected':''}>Cost · high to low</option></select><span class="sync">${rows.length} of ${state.tickets.length} records</span></div>${rows.length?ticketTable(rows):empty(state.tickets.length?'No matching tickets':'No tickets registered',state.tickets.length?'Adjust the search or status filter.':'Register a repair to create the first backend record.')}</section>`}
function partsTable(rows){return `<div class="table-wrap"><table class="table" style="min-width:540px"><thead><tr><th>Part ID</th><th>Part name</th><th>Quantity</th><th>Unit price</th><th>Stock value</th></tr></thead><tbody>${rows.map(p=>`<tr><td class="id mono">P-${String(p.id).padStart(3,'0')}</td><td>${esc(p.name)}</td><td class="mono">${p.quantity}</td><td class="mono">${money(p.price)}</td><td class="mono">${money(p.quantity*p.price)}</td></tr>`).join('')}</tbody></table></div>`}
function partsView(){return `<section class="card"><div class="card-head"><div><h2>Spare parts catalog</h2><p>Inventory operations are stored in <span class="mono">parts.dat</span>.</p></div><div class="pill">${state.parts.length} part types</div></div>${state.parts.length?partsTable(state.parts):empty('Inventory is empty','Add a spare part to create a backend inventory record.')}</section>`}
function analyticsView(){if(!state.adminStats||!state.monthly)return `<div class="card">${empty('Loading secure analytics','Requesting administrator data from the C backend…')}</div>`;let s=state.adminStats,max=Math.max(1,...state.monthly);return `<div class="stats-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${statCard('Total repair tickets',s.total)}${statCard('Collected revenue',money(s.revenue),'Collected tickets only')}${statCard('Collected repairs',s.statuses[3].count,'Status: Collected')}</div><div class="grid lower-grid"><section class="card"><div class="card-head"><div><h2>Monthly repair activity</h2><p>Count of tickets by their original month field.</p></div><span class="pill">Jan — Dec</span></div><div class="chart">${state.monthly.map((v,i)=>`<div class="bar-group"><span class="bar-val">${v}</span><div class="bar" style="height:${Math.max(2,v/max*75)}%" title="${MONTHS[i]}: ${v} tickets"></div><span class="bar-label">${MONTHS[i]}</span></div>`).join('')}</div></section><section class="card"><div class="card-head"><div><h2>Ticket distribution</h2><p>Cost totals by current status.</p></div></div><div class="status-list">${s.statuses.map((x,i)=>`<div class="status-row"><span><i class="status s${i}" style="font-style:normal">${x.name}</i></span><div class="track"><i style="width:${s.total?x.count/s.total*100:0}%"></i></div><span class="mono" style="text-align:right">${x.count} · ${money(x.costTotal)}</span></div>`).join('')}</div><div style="border-top:1px solid var(--line);margin-top:17px;padding-top:15px;display:flex;justify-content:space-between;font-size:11px"><span class="muted">Collected-ticket revenue</span><strong class="mono">${money(s.revenue)}</strong></div></section></div>`}
function inventoryView(){if(!state.inventory)return `<div class="card">${empty('Loading inventory','Requesting protected inventory summary…')}</div>`;let i=state.inventory;return `<div class="stats-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${statCard('Part types',i.partTypes)}${statCard('Units in stock',i.units)}${statCard('Inventory value',money(i.inventoryValue),'Quantity × unit price')}</div><section class="card"><div class="card-head"><div><h2>Stock detail</h2><p>Live quantities and value from the C inventory.</p></div></div>${i.parts.length?partsTable(i.parts):empty('No spare parts','Inventory has no records.')}</section>`}
function viewContent(){if(!state.online)return `<section class="card">${empty('C backend disconnected','Start the backend executable and retry. No demo figures or simulated records are shown.')}<div style="text-align:center"><button class="btn primary" id="retryBackend">${icon('refresh')} Retry connection</button></div></section>`;return state.view==='overview'?overview():state.view==='tickets'?ticketsView():state.view==='parts'?partsView():state.view==='analytics'?analyticsView():state.view==='inventory'?inventoryView():overview()}
function wireView(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{state.view=b.dataset.goto;renderApp()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>ticketDetail(Number(b.dataset.detail)));if($('#ticketSearch')){$('#ticketSearch').oninput=e=>{state.query=e.target.value;state.searchResult=null;state.sortedTickets=null;let p=e.target.selectionStart;renderApp();$('#ticketSearch').focus();$('#ticketSearch').setSelectionRange(p,p)};$('#ticketSearch').onkeydown=async e=>{if(e.key==='Enter'&&/^\d+$/.test(e.target.value.trim())){e.preventDefault();try{let r=await api('/api/tickets/search?id='+encodeURIComponent(e.target.value.trim()));state.searchResult=[r]}catch(err){if(err.status===404)state.searchResult=[];else{toast('Search failed',err.message,'err');return}}renderApp()}}}if($('#statusFilter'))$('#statusFilter').onchange=e=>{state.filter=e.target.value;renderApp()};if($('#ticketSort'))$('#ticketSort').onchange=async e=>{state.sort=e.target.value;state.sortedTickets=null;if(state.sort==='costAsc'||state.sort==='costDesc'){try{let r=await api(`/api/tickets/sort?by=cost&order=${state.sort==='costAsc'?'asc':'desc'}`);state.sortedTickets=r.tickets}catch(err){toast('Sort failed',err.message,'err')}}renderApp()};if($('#quickTicket'))$('#quickTicket').onclick=ticketModal;if($('#quickPart'))$('#quickPart').onclick=partModal;if($('#retryBackend'))$('#retryBackend').onclick=()=>refreshData(false);}
function showModal(title,body,wide=false){let wrap=document.createElement('div');wrap.className='modal-back';wrap.innerHTML=`<div class="modal ${wide?'large':''}"><div class="modal-head"><div><div class="eyebrow">${state.portal==='admin'?'ADMINISTRATOR':'SERVICE DESK'} · BACKEND OPERATION</div><h2>${title}</h2></div><button class="icon-btn" data-close>${icon('close')}</button></div>${body}</div>`;document.body.append(wrap);wrap.querySelector('[data-close]').onclick=()=>wrap.remove();wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};return wrap}
function ticketModal(){let m=showModal('Register repair ticket',`<form id="ticketForm"><div class="form-grid"><div class="form-group"><label>Customer name</label><input class="field" name="name" required maxlength="49" placeholder="Full name"></div><div class="form-group"><label>Phone · digits only</label><input class="field" name="phone" required maxlength="19" inputmode="numeric" pattern="[0-9]+" placeholder="Phone number"></div><div class="form-group"><label>Device</label><input class="field" name="device" required maxlength="49" placeholder="Laptop, desktop…"></div><div class="form-group"><label>Month received</label><select class="field" name="month">${MONTHS.map((x,i)=>`<option value="${i+1}" ${(new Date().getMonth()===i)?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group full"><label>Issue description</label><textarea class="field" name="issue" required maxlength="99" placeholder="Describe the reported fault"></textarea></div><div class="form-group"><label>Estimated cost</label><input class="field" name="cost" type="number" min="0" max="1000000" step="0.01" required placeholder="0.00"></div></div><div class="modal-actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Create ticket</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;b.textContent='Saving to C…';let f=new FormData(e.currentTarget),data=Object.fromEntries(f);data.month=Number(data.month);data.cost=Number(data.cost);try{let r=await api('/api/tickets',{method:'POST',data});m.remove();toast('Ticket registered',`Ticket #${r.ticket.id} saved to tickets.dat`);state.view='tickets';await refreshData(true)}catch(err){toast('Ticket not saved',err.message,'err');b.disabled=false;b.textContent='Create ticket'}}}
function partModal(){let m=showModal('Add spare part',`<form id="partForm"><div class="form-grid"><div class="form-group full"><label>Part name</label><input class="field" name="name" required maxlength="49" placeholder="Exact inventory name"></div><div class="form-group"><label>Quantity</label><input class="field" name="quantity" type="number" min="0" max="100000" step="1" required value="1"></div><div class="form-group"><label>Unit price</label><input class="field" name="price" type="number" min="0" max="1000000" step="0.01" required placeholder="0.00"></div></div><div class="modal-actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Add part</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;b.textContent='Saving to C…';let f=new FormData(e.currentTarget),data=Object.fromEntries(f);data.quantity=Number(data.quantity);data.price=Number(data.price);try{let r=await api('/api/parts',{method:'POST',data});m.remove();toast('Spare part added',`${r.part.name} saved to parts.dat`);state.view=state.portal==='admin'?'inventory':'parts';await refreshData(true)}catch(err){toast('Part not added',err.message,'err');b.disabled=false;b.textContent='Add part'}}}
async function ticketDetail(id){try{let t=await api(`/api/tickets/${id}`);let m=showModal(`Ticket #${t.id}`,`<div class="form-grid"><div><div class="eyebrow">CUSTOMER</div><div style="margin-top:5px">${esc(t.name)}</div><div class="muted">${esc(t.phone)}</div></div><div><div class="eyebrow">DEVICE</div><div style="margin-top:5px">${esc(t.device)}</div></div><div class="form-group full"><div class="eyebrow">REPORTED ISSUE</div><div style="margin-top:5px;color:#c9d4dd">${esc(t.issue)}</div></div><div><div class="eyebrow">MONTH</div><div style="margin-top:5px">${MONTHS[t.month-1]}</div></div><div><div class="eyebrow">ESTIMATE</div><div style="margin-top:5px">${money(t.cost)}</div></div><div class="form-group full"><label>Repair status</label><select class="field" id="changeStatus">${STATUS.map((s,i)=>`<option value="${i}" ${i===t.status?'selected':''}>${s}</option>`).join('')}</select><div class="muted" style="font-size:10px;margin-top:6px">Status updates are committed to the C data file.</div></div></div><div class="modal-actions"><button class="btn" data-close>Close</button><button class="btn primary" id="saveStatus">Save status</button></div>`);m.querySelector('#saveStatus').onclick=async e=>{let b=e.currentTarget;b.disabled=true;b.textContent='Updating…';try{let r=await api(`/api/tickets/${id}/status`,{method:'POST',data:{status:Number(m.querySelector('#changeStatus').value)}});m.remove();toast('Status updated',`#${id} is now ${r.statusName}`);await refreshData(true)}catch(err){toast('Status not updated',err.message,'err');b.disabled=false;b.textContent='Save status'}}}catch(e){toast('Ticket unavailable',e.message,'err')}}
async function logout(){try{await api('/api/admin/logout',{method:'POST',admin:true});toast('Signed out','Administrator session invalidated by C backend.')}catch(e){toast('Sign-out issue',e.message,'err')}finally{state.adminToken='';state.portal=null;clearInterval(state.timer);access()}}
async function downloadBackup(){try{let b=await api('/api/admin/backup',{admin:true});for(const [name,data] of [['tickets.dat',b.ticketsDatBase64],['parts.dat',b.partsDatBase64]]){let a=document.createElement('a');a.href='data:application/octet-stream;base64,'+data;a.download=name;document.body.append(a);a.click();a.remove()}toast('Backup ready','Downloaded the protected binary data snapshots.')}catch(e){toast('Backup unavailable',e.message,'err')}}
intro();setTimeout(access,700);
})();
</script>
</body></html>
